<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#C4D700">
<title>TM eHUB</title>
<style>
  :root { --brand:#C4D700; --ink:#111; --muted:#777; --line:#e6e6e6; --bad:#d9363e; --ok:#2e9e44; --eng:#2962ff; --dbg:#ff9100; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:#fff; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--brand); color:#fff;
    display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top) + 10px) 14px 10px; }
  header h1 { flex:1; margin:0; font-size:19px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; user-select:none; }
  header .mode { font-size:12px; padding:2px 8px; border-radius:10px; background:rgba(0,0,0,.25); }
  button { font:inherit; border:0; border-radius:8px; cursor:pointer; }
  .btn { background:#000; color:#fff; padding:8px 14px; font-size:15px; }
  .btn:disabled { opacity:.5; }
  .spin { width:18px; height:18px; border:3px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:r 0.8s linear infinite; display:none; }
  .busy .spin { display:block; }
  @keyframes r { to { transform:rotate(360deg); } }

  main { padding:6px 16px 40px; max-width:560px; margin:0 auto; }
  #splash { text-align:center; padding:40px 20px 10px; }
  #splash img { width:70%; max-width:300px; }
  #splash p { color:var(--muted); font-size:14px; line-height:1.6; }
  #splash .btn { font-size:17px; padding:12px 28px; margin-top:8px; }
  #splash label { display:block; margin-top:14px; color:var(--muted); font-size:13px; }
  .warn { background:#fff4e5; border:1px solid #ffd59a; color:#8a5300; border-radius:8px; padding:10px 12px; font-size:14px; margin:12px 0; display:none; }

  .row { display:flex; align-items:center; gap:8px; padding:14px 4px; border-bottom:1px solid var(--line); font-size:18px; }
  .row .k { font-weight:700; white-space:nowrap; }
  .row .v { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .seg { display:inline-flex; background:#9e9e9e; border-radius:20px; overflow:hidden; }
  .seg button { background:transparent; color:#fff; padding:8px 0; min-width:78px; font-size:14px; border-radius:20px; }
  .seg button.on { background:#000; }
  .seg.size button { min-width:64px; }
  #fw { user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }

  #eng { display:none; margin-top:10px; border-top:3px solid var(--eng); }
  #eng h2 { font-size:14px; color:var(--eng); margin:10px 4px 0; }
  .orange { color:#ff5722; font-weight:700; }
  .switch { position:relative; width:52px; height:30px; }
  .switch input { opacity:0; width:0; height:0; }
  .switch span { position:absolute; inset:0; background:#bbb; border-radius:30px; transition:.2s; }
  .switch span::before { content:""; position:absolute; width:24px; height:24px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
  .switch input:checked + span { background:var(--brand); }
  .switch input:checked + span::before { transform:translateX(22px); }
  input[type=range] { flex:1; accent-color:var(--brand); }
  .tools { display:flex; gap:8px; flex-wrap:wrap; padding:14px 4px; }
  .tools .btn { font-size:13px; padding:7px 10px; background:#444; }
  #log { font:12px/1.4 ui-monospace,Menlo,monospace; background:#f6f6f6; border-radius:8px; padding:8px; max-height:180px; overflow:auto; white-space:pre-wrap; display:none; }

  #toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px); transform:translateX(-50%);
    background:#323232; color:#fff; padding:10px 16px; border-radius:8px; font-size:15px; opacity:0; transition:opacity .25s; pointer-events:none; max-width:90vw; z-index:20; }
  #toast.show { opacity:1; } #toast.ok { background:var(--ok); } #toast.bad { background:var(--bad); }

  dialog { border:0; border-radius:12px; padding:20px; width:min(90vw,340px); }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  dialog h3 { margin:0 0 12px; }
  dialog input { width:100%; font-size:18px; padding:10px; border:1px solid #aaa; border-radius:6px; }
  dialog .acts { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
  dialog .acts button { padding:8px 16px; font-size:15px; }
  .plain { background:transparent; color:var(--eng); }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:20px; }
</style>
</head>
<body>
<header id="hdr">
  <h1 id="title">TM eHUB</h1>
  <span class="mode" id="modeTag" style="display:none"></span>
  <div class="spin"></div>
  <button class="btn" id="connBtn">連線</button>
</header>

  const a = [ID1, ID2, ID3, header, type, func, ...data];
  while (a.length < 18) a.push(0);
  let sum = 0; for (const b of a) sum += b;
  a.push(sum & 0xFF, 10);
  return new Uint8Array(a);
}
function isTmPacket(p) {
  if (!p || p.length !== 20) return false;
  let sum = 0; for (let i = 0; i < 18; i++) sum += p[i];
  return (sum & 0xFF) === p[18] && p[0] === ID1 && p[1] === ID2 && p[2] === ID3;
}

/* ===== 狀態 ===== */
const INIT_CHECK_BLE_COUNT = 10;
const S = {
  device:null, rw:null, notify:null, connected:false, busy:false, userDisconnect:false,
  checkBleCount: INIT_CHECK_BLE_COUNT, hasFirstGet:false, showTestItem:false, needDebugMode:false,
  lastMode: MODE.NORMAL, lastModePosition:1, size: SIZE.S26, lastSizePosition:0,
  battery:0, angle:0, temp:0, travel:0, fw:0, engCode:'', rpm:0, speed:0, voltage:0, current:0, accel:0,
  tempDetect:0, angleDetect:0, records:[], showLog:false
};
const TEMP_THRESHOLD = 50, ANGLE_THRESHOLD = 4, ALERT_TIME = 600; // 秒

const $ = id => document.getElementById(id);
let toastT;
function toast(msg, kind) {
  const t = $('toast'); t.textContent = msg; t.className = 'show ' + (kind || '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 2500);
}
function dbgToast(msg, kind) { if (S.showTestItem) toast(msg, kind); }
function log(dir, bytes) {
  if (!S.showLog) return;
  const hex = Array.from(bytes, b => b.toString(16).padStart(2, '0')).join(' ');
  const el = $('log'); el.textContent = `${dir} ${hex}\n` + el.textContent.slice(0, 6000);
}

/* ===== 寫入佇列（避免 GATT operation in progress）===== */
let writeChain = Promise.resolve();
function sendPkt(type, func, data = []) { return sendRaw(buildPacket(HEADER_D2M, type, func, data)); }
function sendRaw(pkt) {
  if (!S.rw || !S.connected) { toast('尚未連線', 'bad'); return Promise.resolve(); }
  const c = S.rw;
  writeChain = writeChain.then(async () => {
    log('TX', pkt);
    const p = c.properties || {};
    try {
      if (p.writeWithoutResponse && c.writeValueWithoutResponse) await c.writeValueWithoutResponse(pkt);
      else if (c.writeValueWithResponse) await c.writeValueWithResponse(pkt);
      else await c.writeValue(pkt);
    } catch (e) {
      // Bluefy 有時 properties 不完整，退回另一種寫法再試一次
      try { await (c.writeValue ? c.writeValue(pkt) : c.writeValueWithResponse(pkt)); }
      catch (e2) { dbgToast('Error: ' + e2.message, 'bad'); }
    }
  });
  return writeChain;
}

/* ===== 連線流程 ===== */
async function scan() {
  if (!navigator.bluetooth) return;
  try {
    const opts = $('allDev').checked
      ? { acceptAllDevices:true, optionalServices:[SERVICE_UUID] }
      : { filters: NAME_PREFIXES.map(n => ({ namePrefix:n })).concat([{ services:[SERVICE_UUID] }]), optionalServices:[SERVICE_UUID] };
    const dev = await navigator.bluetooth.requestDevice(opts);
    if (S.device && S.device !== dev) S.device.removeEventListener('gattserverdisconnected', onDisconnected);
    S.device = dev;
    dev.addEventListener('gattserverdisconnected', onDisconnected);
    $('title').textContent = dev.name || 'eHub';
    $('splash').style.display = 'none';
    $('dash').style.display = '';
    S.checkBleCount = INIT_CHECK_BLE_COUNT;
    connect();
  } catch (e) {
    if (e.name !== 'NotFoundError') toast('搜尋失敗：' + e.message, 'bad'); // NotFoundError = 使用者取消
  }
}

async function connect() {
  if (!S.device) return;
  S.userDisconnect = false; setBusy(true, '連線中');
  try {
    const server = await S.device.gatt.connect();
    await sleep(500);                       // 對照 Flutter 的 500ms 延遲
    const svc = await server.getPrimaryService(SERVICE_UUID);
    S.rw = await svc.getCharacteristic(RW_UUID);
    S.notify = await svc.getCharacteristic(NOTIFY_UUID);
    await sleep(100);
    S.notify.removeEventListener('characteristicvaluechanged', onNotify);
    S.notify.addEventListener('characteristicvaluechanged', onNotify);
    await S.notify.startNotifications();
    S.connected = true; S.hasFirstGet = false;
    S.checkBleCount = INIT_CHECK_BLE_COUNT;
    dbgToast('Connect: Success', 'ok');
  } catch (e) {
    S.connected = false;
    if (S.checkBleCount > 0) { S.checkBleCount--; render(); setTimeout(connect, 200 + 300 * (INIT_CHECK_BLE_COUNT - S.checkBleCount)); }
    else { S.checkBleCount = INIT_CHECK_BLE_COUNT; toast('連線失敗：' + e.message, 'bad'); }
  }
  setBusy(false); render();
}

function disconnect() {
  S.userDisconnect = true;
  if (S.device && S.device.gatt.connected) S.device.gatt.disconnect();
  S.connected = false; S.checkBleCount = INIT_CHECK_BLE_COUNT; render();
  dbgToast('Disconnect: Success', 'ok');
}

function onDisconnected() {
  S.connected = false; S.hasFirstGet = false; S.rw = null; render();
  if (!S.userDisconnect) {               // 非手動中斷 → 自動重連（對照 needReconnect）
    if (S.checkBleCount > 0) { S.checkBleCount--; setTimeout(connect, 200); }
    else toast('連線中斷', 'bad');
  }
}

function setBusy(b, label) { S.busy = b; $('hdr').classList.toggle('busy', b); if (label) $('connBtn').textContent = label; }
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ===== 接收解析（對照 onValueReceived）===== */
function onNotify(ev) {
  const dv = ev.target.value;
  const p = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
  log('RX', p);
  if (!isTmPacket(p)) return;
  const header = p[3], type = p[4], func = p[5];
  if (header !== HEADER_M2D) return;

  if (type === TYPE.ALL && func === FUNC.INFO) {
    S.battery = p[6];
    S.fw = p[9];
    let voltage = p[10], current = p[11], rpm = p[12];
    S.angle = p[13];
    S.travel = p[14];
    S.temp = p[16];
    S.engCode = String(p[15] + p[16] * 100 + p[17] * 10000 + p[18] * 1000000);

    if (!S.hasFirstGet) {
      S.size = p[7]; S.lastMode = p[8]; S.accel = p[15];
      S.lastSizePosition = { 0:1, 1:2, 2:0 }[S.size] ?? S.lastSizePosition;
      if (S.lastMode === MODE.DEBUG) S.needDebugMode = true;
      else { S.needDebugMode = false; S.lastModePosition = { 0:1, 1:2, 2:0 }[S.lastMode] ?? 1; }
      S.hasFirstGet = true;
    }

    S.current = (current - 50) / 10;
    S.voltage = (voltage + 180) / 10;
    S.rpm = rpm * 2.5;
    S.speed = Math.trunc(S.rpm * (S.size === SIZE.S700C ? 0.1319 : 0.12444));
    dbgToast('Receive info', 'ok');
  } else if ((type === TYPE.SIZE || type === TYPE.MODE) && func === FUNC.ACK_SET) {
    dbgToast('Receive set ack', 'ok');
  }

  // 紀錄：時間,名稱,模式,尺寸,電量,速度,坡度,溫度,行駛時間,韌體版本,轉速,電壓,電流
  const d = new Date(), z = n => String(n).padStart(2, '0');
  const ts = `${d.getFullYear()}/${z(d.getMonth()+1)}/${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;
  S.records.push([ts, S.device?.name || '', S.lastModePosition, S.lastSizePosition, S.battery, S.speed, S.angle, S.temp, S.travel, S.fw, S.rpm, S.voltage, S.current].join(','));
  if (S.records.length > 50000) S.records.shift();
  render();
}

/* ===== 畫面 ===== */
function setSeg(seg, idx) { seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.i === idx)); }
function render() {
  if (!S.busy) $('connBtn').textContent = S.connected ? '斷線' : '連線';
  $('vBattery').textContent = S.battery + '%';
  $('vSpeed').textContent = S.speed + ' km/h';
  $('vAngle').textContent = S.angle + 'º';
  $('vTemp').textContent = S.temp + 'º';
  $('vTravel').textContent = S.travel + ' mins';
  $('vFw').textContent = S.fw || 1;
  setSeg($('modeSeg'), S.lastModePosition);
  setSeg($('sizeSeg'), S.lastSizePosition);
  $('modeRow').style.display = S.needDebugMode ? 'none' : '';
  $('eng').style.display = S.showTestItem ? 'block' : 'none';
  $('vCheck').textContent = S.checkBleCount;
  $('vEngCode').textContent = S.engCode;
  $('dbgSw').checked = S.needDebugMode;
  $('vRpm').textContent = S.rpm + ' rpm';
  $('vVolt').textContent = S.voltage + ' V';
  $('vCurr').textContent = S.current + ' A';
  $('accRow').style.display = S.needDebugMode ? '' : 'none';
  if (document.activeElement !== $('acc')) { $('acc').value = S.accel; $('accV').textContent = S.accel; }
  $('recCount').textContent = S.records.length + ' 筆';
  const tag = $('modeTag');
  if (S.showTestItem) { tag.style.display = ''; tag.textContent = S.needDebugMode ? 'Test Mode' : 'Distributor Mode'; tag.style.background = S.needDebugMode ? 'var(--dbg)' : 'var(--eng)'; }
  else tag.style.display = 'none';
}

/* ===== 操作 ===== */
$('scanBtn').onclick = scan;
$('connBtn').onclick = () => {
  if (S.busy || S.connected) disconnect();
  else if (S.device) { S.checkBleCount = INIT_CHECK_BLE_COUNT; connect(); }
  else scan();
};

// 模式：0 ECO / 1 NORMAL / 2 SPORT
$('modeSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const i = +b.dataset.i, m = [MODE.ECO, MODE.NORMAL, MODE.SPORT][i];
  S.lastModePosition = i; S.lastMode = m; render();
  sendPkt(TYPE.MODE, FUNC.SET, [m]);
};
// 尺寸：0 → 24 / 1 → 26 / 2 → 700C
$('sizeSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const i = +b.dataset.i, s = [SIZE.S24, SIZE.S26, SIZE.S700C][i];
  S.lastSizePosition = i; S.size = s; render();
  sendPkt(TYPE.SIZE, FUNC.SET, [s]);
};

// 長按「韌體版本」→ 密碼 → 工程模式
let lpT;
const fw = $('fw');
const lpStart = e => { lpT = setTimeout(() => { $('pwIn').value = ''; $('pwDlg').showModal(); setTimeout(() => $('pwIn').focus(), 50); }, 700); };
const lpEnd = () => clearTimeout(lpT);
fw.addEventListener('touchstart', lpStart, { passive:true });
fw.addEventListener('mousedown', lpStart);
['touchend','touchmove','touchcancel','mouseup','mouseleave'].forEach(ev => fw.addEventListener(ev, lpEnd));
fw.addEventListener('contextmenu', e => e.preventDefault());
$('pwDlg').addEventListener('close', () => {
  if ($('pwDlg').returnValue !== 'ok') return;
  if ($('pwIn').value === PASSWORD) { S.showTestItem = true; render(); toast('密碼正確，已進入工程模式', 'ok'); }
  else toast('密碼錯誤', 'bad');
});

// Debug 模式開關
$('dbgSw').onchange = e => {
  S.needDebugMode = e.target.checked; render();
  if (S.needDebugMode) {
    sendPkt(TYPE.MODE, FUNC.SET, [MODE.DEBUG]);
    setTimeout(() => sendPkt(TYPE.TEMP, FUNC.GET, []), 500);
  } else {
    sendPkt(TYPE.MODE, FUNC.SET, [S.lastMode]);
  }
};

// 油門 0~100，step 10（對照 Slider divisions:10）
let lastAcc = -1;
$('acc').oninput = e => {
  const v = +e.target.value; $('accV').textContent = v;
  if (v === lastAcc) return; lastAcc = v; S.accel = v;
  sendPkt(TYPE.ACCEL, FUNC.SET, [v]);
};
$('acc').onchange = () => { lastAcc = -1; };

// 點標題 = 清除紀錄（對照 clearPressed）
$('title').onclick = () => { S.records = []; render(); };
$('clrBtn').onclick = () => { S.records = []; render(); toast('紀錄已清除'); };
$('dlBtn').onclick = () => {
  const head = '時間,名稱,模式,尺寸,電量,速度,坡度,溫度,行駛時間,韌體版本,轉速,電壓,電流\n';
  const blob = new Blob(['﻿' + head + S.records.join('\n')], { type:'text/csv' });
  const d = new Date(), z = n => String(n).padStart(2, '0');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ehubData_${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.csv`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$('logBtn').onclick = () => { S.showLog = !S.showLog; $('log').style.display = S.showLog ? 'block' : 'none'; $('logBtn').textContent = S.showLog ? '隱藏封包' : '顯示封包'; };

// 溫度 / 坡度持續超標監控（對照 startMonitoring，每秒）
setInterval(() => {
  S.tempDetect  = S.temp  >= TEMP_THRESHOLD  ? S.tempDetect + 1  : 0;
  S.angleDetect = S.angle >= ANGLE_THRESHOLD ? S.angleDetect + 1 : 0;
  const msgs = [];
  if (S.tempDetect  >= ALERT_TIME) msgs.push('溫度已超標，建議重新校正');
  if (S.angleDetect >= ALERT_TIME) msgs.push('坡度已超標，建議重新校正');
  const box = $('alertBox'); box.textContent = msgs.join('　'); box.style.display = msgs.length ? 'block' : 'none';
}, 1000);

// 環境檢查
(async () => {
  let msg = '';
  if (!window.isSecureContext) msg = '這個網頁必須用 HTTPS 開啟，藍牙才能使用。';
  else if (!navigator.bluetooth) msg = '這個瀏覽器不支援 Web Bluetooth。iPhone 請用 Bluefy 開啟；電腦請用 Chrome 或 Edge。';
  else if (navigator.bluetooth.getAvailability && !(await navigator.bluetooth.getAvailability())) msg = '藍牙未開啟或無法使用，請先打開藍牙。';
  if (msg) { const w = $('noBle'); w.textContent = msg; w.style.display = 'block'; if (!navigator.bluetooth) $('scanBtn').disabled = true; }
})();
render();
</script>
</body>
</html>
